name: CI

# CI du projet « Permis d'agir » (app Forge Jira + serveur MCP).
#
# Le check publié s'appelle `ci` : il est exigé par le ruleset de `main` et
# par la file Mergify, comme `ci-budget` et `couche0`.
# Budget : verdict en 5 minutes au plus (règle CI maison) — installation des
# dépendances (cache npm du runner), typage TypeScript, tests Jest, garde du
# manifeste, sanity docs.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : un sous-dossier parasite d'un run
      # précédent peut survivre et fausser les tests. On garde /node_modules
      # (le cache npm de la machine fait le reste) mais rien d'autre.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Nettoyage du workspace
        shell: bash
        run: git clean -ffdx -e /node_modules

      # Node est déjà installé sur le runner self-hosted (R630) : on ajoute son
      # chemin au PATH sans télécharger de toolchain pour rester sous les 5 min.
      - name: Node (version du runner)
        run: node --version

      # Le front-end UI Kit (react, @forge/react, @forge/bridge) pèse ~1,6 Go
      # une fois installé : il est en optionalDependencies et la CI l'omet, car
      # les écrans sont des .jsx ni typés ni testés ici — toute la logique de
      # décision vit dans src/core et src/ui, qui sont typés et testés.
      # Sans cela l'installation seule dépassait le budget de 5 minutes et
      # saturait le disque des runners. Un déploiement Forge, lui, a besoin du
      # front-end : `npm install` (ou `npm run install:all`) avant `forge deploy`.
      - name: Installation des dépendances
        run: npm ci --omit=optional --prefer-offline --no-audit --no-fund

      - name: Typage (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitaires (jest)
        run: |
          mkdir -p reports
          npx jest --ci --silent --json --outputFile=reports/jest.json

      # Le manifeste et le code doivent rester d'accord : chaque handler
      # existe, chaque action pointe vers une fonction, les outils MCP et
      # le miroir runtime ne divergent pas.
      - name: Garde du manifeste
        run: node scripts/check-manifest.mjs

      # Chaque chiffre écrit dans la documentation est confronté à la réalité
      # du dépôt : une doc qui ment (tables, tests, outils, version déployée)
      # fait échouer la PR au lieu d'attendre d'être lue.
      - name: Affirmations des docs
        run: node scripts/verify-claims.mjs --jest-json reports/jest.json

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import pathlib
          racines = [pathlib.Path(".")]
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for racine in racines:
              for f in sorted(racine.rglob("*")):
                  if ".git/" in f.as_posix() or f.suffix.lower() not in exts:
                      continue
                  if "node_modules/" in f.as_posix():
                      continue
                  total += 1
                  try:
                      contenu = f.read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      illisibles.append(f.as_posix())
                      continue
                  if not contenu.strip():
                      vides.append(f.as_posix())
          print("%d doc(s) contrôlé(s)" % total)
          for f in illisibles:
              print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
              print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF
