# Enforcement point 3 (spec §10) — permit verification from a CI step.
#
# An app installed on Jira cannot call the Bitbucket API (spec §18), so the
# merge gate for pull requests lives on the forge side: this workflow extracts
# the `Permis-Agent: PA-2026-000417` line an agent cites in its pull request
# description, asks the gate whether that permit is still valid **and whether
# it covers the files this pull request changes**, and fails the check when it
# does not.
#
# Checking the diff is the point. Without it any valid permit would let any
# pull request through: the gate answers `covers` and lists the paths that fall
# outside the permit scope, and the check fails on either.
#
# Copy this file to `.github/workflows/` of the repository you want to guard,
# and set two repository secrets:
#   PERMIS_GATE_URL   the gate web trigger URL (`forge webtrigger create -f gate`)
#   PERMIS_PROJECT    the Jira project key the pull requests belong to (e.g. PAY)
#
# The project is not decoration: the verification path is unauthenticated (a CI
# runner holds the gate URL, not a pilot's token), so the gate only answers
# about the permits of the project the request names. A check that does not say
# which project it guards gets `400 PROJECT_REQUIRED` and fails — the safe
# direction.
#
# No personal token is needed: permit verification is a read-only check of a
# signature, an expiry and a scope. Deciding an action still requires the
# pilot's token.
#
# Deliberately triggered by the unprivileged `pull_request` event: the check only
# reads the pull request description and its file list and calls the gate, so it
# needs no write access and must not run with elevated privileges.

name: Permis d'agir — permit check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: permis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  permit:
    name: permit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the permit cited in the description
        id: permit
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          permit="$(printf '%s' "$BODY" | grep -oE 'PA-[0-9]{4}-[0-9]{6}' | head -1)"
          if [ -z "$permit" ]; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "No permit cited. Add 'Permis-Agent: PA-YYYY-NNNNNN' to the description if this change needed one."
          else
            echo "found=$permit" >> "$GITHUB_OUTPUT"
            echo "Permit cited: $permit"
          fi

      - name: List the files this pull request changes
        if: steps.permit.outputs.found != ''
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `pull-requests: read` is enough for the file list; no third-party action.
          curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files?per_page=100" \
            | python3 -c 'import json,sys; print("\n".join(f["filename"] for f in json.load(sys.stdin)))' \
            > changed.txt
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          cat changed.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; cat changed.txt

      - name: Verify the permit, and its scope, against the gate
        if: steps.permit.outputs.found != ''
        env:
          GATE_URL: ${{ secrets.PERMIS_GATE_URL }}
          PROJECT: ${{ secrets.PERMIS_PROJECT }}
          PERMIT: ${{ steps.permit.outputs.found }}
          PATHS: ${{ steps.files.outputs.paths }}
        run: |
          if [ -z "$GATE_URL" ]; then
            echo "::error::PERMIS_GATE_URL secret is not set"
            exit 1
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::PERMIS_PROJECT secret is not set (the Jira project key this repository guards)"
            exit 1
          fi
          payload="$(printf '%s' "$PATHS" | python3 -c '
          import json, sys
          paths = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps({"permitId": sys.argv[1], "projectId": sys.argv[2], "paths": paths}))' "$PERMIT" "$PROJECT")"
          answer="$(curl -sS --max-time 30 -X POST "$GATE_URL" \
            -H 'Content-Type: application/json' -d "$payload")"
          echo "gate answer: $answer"
          printf '%s' "$answer" | python3 -c '
          import json, sys
          answer = json.load(sys.stdin)
          if answer.get("error") == "PROJECT_REQUIRED":
              print("::error::The gate refused the verification: it must name the project (PERMIS_PROJECT).")
              raise SystemExit(1)
          valid = answer.get("valid", False)
          covers = answer.get("covers", False)
          uncovered = answer.get("uncovered") or []
          if not valid:
              print("::error::Permit %s is not valid (expired, revoked, suspended, spent, or signature mismatch)" % answer.get("permitId"))
              raise SystemExit(1)
          if not covers:
              print("::error::Permit %s does not cover: %s" % (answer.get("permitId"), ", ".join(uncovered)))
              print("::error::Ask for a permit scoped to these paths, or narrow the pull request.")
              raise SystemExit(1)
          print("Permit %s is valid and covers every changed file." % answer.get("permitId"))'

      - name: Report when no permit was needed
        if: steps.permit.outputs.found == ''
        run: echo "No permit cited — nothing to verify. Sensitive changes must cite one."
