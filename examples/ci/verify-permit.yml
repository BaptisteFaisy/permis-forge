# Enforcement point 3 (spec §10) — permit verification from a CI step.
#
# An app installed on Jira cannot call the Bitbucket API (spec §18), so the
# merge gate for pull requests lives on the forge side: this workflow extracts
# the `Permis-Agent: PA-2026-000417` line an agent cites in its pull request
# description, asks the gate whether that permit is still valid, and fails the
# check when it is not.
#
# Copy this file to `.github/workflows/` of the repository you want to guard,
# and set two repository secrets:
#   PERMIS_GATE_URL   the gate web trigger URL (`forge webtrigger create -f gate`)
#
# No secret token is needed: permit verification is a read-only check of a
# signature and an expiry. Deciding an action still requires the pilot's token.
#
# Deliberately triggered by the unprivileged `pull_request` event: the check only
# reads the pull request description and calls the gate, so it needs no write
# access and must not run with elevated privileges.

name: Permis d'agir — permit check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: permis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  permit:
    name: permit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the permit cited in the description
        id: permit
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          permit="$(printf '%s' "$BODY" | grep -oE 'PA-[0-9]{4}-[0-9]{6}' | head -1)"
          if [ -z "$permit" ]; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "No permit cited. Add 'Permis-Agent: PA-YYYY-NNNNNN' to the description if this change needed one."
          else
            echo "found=$permit" >> "$GITHUB_OUTPUT"
            echo "Permit cited: $permit"
          fi

      - name: Verify the permit against the gate
        if: steps.permit.outputs.found != ''
        env:
          GATE_URL: ${{ secrets.PERMIS_GATE_URL }}
          PERMIT: ${{ steps.permit.outputs.found }}
        run: |
          if [ -z "$GATE_URL" ]; then
            echo "::error::PERMIS_GATE_URL secret is not set"
            exit 1
          fi
          answer="$(curl -sS --max-time 30 -X POST "$GATE_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"permitId\":\"$PERMIT\"}")"
          echo "gate answer: $answer"
          valid="$(printf '%s' "$answer" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("valid", False))')"
          if [ "$valid" != "True" ]; then
            echo "::error::Permit $PERMIT is not valid (expired, revoked, spent, or signature mismatch)"
            exit 1
          fi
          echo "Permit $PERMIT is valid."

      - name: Report when no permit was needed
        if: steps.permit.outputs.found == ''
        run: echo "No permit cited — nothing to verify. Sensitive changes must cite one."
